name: Claude Code

# Responds to @claude mentions in issue comments and PR review comments.
# Requires the ANTHROPIC_API_KEY repository secret and the Claude GitHub App
# to be installed on this repository.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    # Only run when a comment actually mentions @claude, to avoid burning
    # Actions minutes / API credits on every comment.
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
      # Required: the action exchanges a GitHub OIDC token to authenticate.
      # Without this the run fails with "Could not fetch an OIDC token".
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
